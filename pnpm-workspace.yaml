packages:
  - "packages/*"
  - "examples/*"
  - "scripts/*"
overrides:
  # CVE-2026-101908: Axios prototype pollution and header override vulnerabilities
  "axios": "^1.20.0"
  # CVE-2026-15195: Prototype pollution in Pointer.set. Fixed in 15.3.6.
  "@apidevtools/swagger-parser>@apidevtools/json-schema-ref-parser": "^15.3.6"
  "cross-spawn": "^7.0.6"
  "d3-color": "3.1.0"
  "graphql": "14.3.1"
  # CVE-2026-33750: Fix security vulnerability in brace-expansion
  # Overriding transitive dependency until minimatch updates to patched brace-expansion version
  "minimatch@^3>brace-expansion": "1.1.21"
  "minimatch@^5>brace-expansion": "2.1.7"
  "openapi-types": "7.2.3"
  # CVE-2026-82417, CVE-2026-82562: TypeError in qs.stringify on a non-callable constructor.isBuffer
  # CVE-2026-110910: qs.stringify with allowEmptyArrays fails to encode the key of an empty array
  # Overriding transitive dependency until all parents update to patched qs version
  "qs": "6.16.2"
  "path-to-regexp@^0": "0.1.13"
  "react-dropzone": "^11.4.2"
  "superagent": "10.2.2"
  # CVE-2026-84375: merge-key resource limit bypass causes prolonged CPU consumption on untrusted YAML
  # Overriding transitive dependency until all parents update to patched js-yaml versions
  "js-yaml@^3": "^3.15.2"
  "js-yaml@^4": "^4.3.2"
  "minimatch@^3": "3.1.5"
  "minimatch@^9": "9.0.8"
  "minimatch@^10": "10.2.1"
  "minimatch@^5": "5.1.9"
  "minimatch@^4": "5.1.9"
  # CVE-2026-1526, CVE-2026-2229, CVE-2026-1528, CVE-2026-1527, CVE-2026-1525, CVE-2026-2203, CVE-2026-12151, CVE-2026-9679, CVE-2026-11525, CVE-2026-6733, CVE-2026-16729, CVE-2026-15157, CVE-2026-16728,
  # CVE-2026-19534 (DoS via unrequested WebSocket subprotocol), CVE-2026-85024 (DoS via permessage-deflate decompression),
  # CVE-2026-18540 (response splitting via retry interceptor), CVE-2026-87018, CVE-2026-109869, CVE-2026-109383, CVE-2026-109924, CVE-2026-109932: Fix security vulnerabilities in undici.
  # Upgraded to ^6.29.1 to fix security vulnerabilities in undici.
  # Waiting for @openapi-contrib/openapi-schema-to-json-schema to release patched version.
  "undici": "^6.29.1"
  # CVE-2026-41907: Fix security vulnerability in uuid
  # Transitive dependencies (node-notifier@8.0.2, jest-junit@16.0.0) still use uuid@8.3.2
  "uuid": "^11.1.1"
  # CVE-2026-33671 (High) / CVE-2026-33672 (Medium): picomatch POSIX bracket method injection and ReDoS.
  "picomatch@3": "3.0.2"
  "picomatch@4": "4.0.4"
  # CVE fix: form-data <4.0.6 — @cypress/request pins ~4.0.4 (tilde), which caps at 4.0.5.
  # All other dependents (axios, superagent, @vscode/vsce, jsdom, @types/node-fetch) use ^4.x
  # which naturally resolves to 4.0.6, so only @cypress/request needs a targeted override.
  "@cypress/request>form-data": "4.0.6"
  # CVE-2026-90711 (CVSS 9.1): IP spoofing via IPv4-mapped IPv6 trust subnet in proxy-addr.
  # express@4.x pins ~2.0.7 and express@5.x pins ^2.0.7 — both ranges allow 2.0.8.
  # Overriding transitive dependency until express ships proxy-addr >= 2.0.8 natively.
  "proxy-addr": "2.0.8"
  # CVE-2026-116689: Fix security vulnerability in follow-redirects (transitive dependency of axios/http-proxy)
  "follow-redirects": "1.16.2"
  # CVE-2026-111181: body-parser < 1.20.9 is vulnerable. express@4 declares a ~1.20.x range, but karma and
  # apollo-server-express pin 1.20.6 exactly, so an express-scoped override does not cover them.
  # Overriding transitive dependency until all parents update to a patched body-parser version.
  "body-parser@^1": "~1.20.9"
  # Overriding transitive dependency until @storybook/core-common and ts-jest update to patched handlebars version
  "handlebars": "4.7.10"
  # CVE-2023-54404: Upgrade all transitive zod dependencies to latest patched 4.x release
  "zod": "^4.6.7"
  # CVE-2026-110306, CVE-2026-110180, CVE-2026-110095, CVE-2026-110725: fast-uri 3.x < 3.1.9 is vulnerable.
  # ajv@8.x still resolved fast-uri 3.1.8.
  # Overriding transitive dependency until all parents update to a patched fast-uri version.
  "fast-uri@^3": "^3.1.9"
  # Overriding uri-js
  "ajv-formats-draft2019>uri-js": "npm:fast-uri@^3.1.9"
  "json-refs>uri-js": "npm:fast-uri@^3.1.9"
